<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Gatão Estudos — registre sua rotina, acompanhe projetos e meça sua evolução.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<title>Gatão Estudos</title>
<style>
:root{--bg:#080b12;--panel:#101621;--panel2:#141e2b;--line:#243246;--text:#edf4ff;--muted:#8b9bb0;--blue:#20b9f5;--blue2:#087db9;--cyan:#63d7ff;--green:#39d69b;--red:#ff6b78;--shadow:0 16px 45px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#12304a 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px 22px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:54px;height:54px;border-radius:16px;object-fit:cover;box-shadow:0 0 28px #1baee533}.brand-tools{display:flex;align-items:center;gap:8px}.logo-edit{border:1px solid #2a4058;background:#152333;color:#9edfff;border-radius:9px;padding:7px 9px;font-size:11px}.brand h1{font-size:20px;letter-spacing:.2px;margin:0}.brand p{color:var(--muted);font-size:12px;margin:1px 0 0}.topright{display:flex;align-items:center;gap:10px}.today{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;background:#0e1520;border:1px solid var(--line);padding:6px;border-radius:15px;width:max-content;margin-bottom:25px}
nav button{border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:10px;font-weight:650}nav button.active{background:#17314a;color:#8cddff;box-shadow:inset 0 0 0 1px #235578}
h2{font-size:23px;margin:0 0 5px;letter-spacing:-.4px}.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:25px}.stat,.panel,.entry,.project{background:linear-gradient(145deg,#121b28,#0e151f);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:17px}.stat small{color:var(--muted);display:block}.stat strong{font-size:27px;display:block;margin-top:5px;letter-spacing:-.7px}.stat span{font-size:11px;color:var(--cyan)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 13px}.sectionhead h3{font-size:16px;margin:0}.btn{border:1px solid #23628a;background:linear-gradient(135deg,#087db9,#075b91);color:white;border-radius:11px;padding:10px 15px;font-weight:700}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#152333;border-color:#2a4058;color:#c9eaff}.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.btn.danger{background:#351a25;border-color:#71313f;color:#ff9ca6}
.list{display:grid;gap:13px}.entry{padding:15px;display:grid;grid-template-columns:145px minmax(0,1fr) 125px;gap:18px;align-items:center}.photo{width:100%;height:120px;object-fit:contain;object-position:center;border-radius:11px;background:#1b2635}.entry h4,.project h4{margin:0 0 5px;font-size:16px}.meta{display:flex;flex-wrap:wrap;gap:7px 13px;color:#aab9ca;font-size:13px}.meta b{color:#e9f5ff}.desc{color:var(--muted);font-size:13px;margin:9px 0 0;white-space:pre-wrap}.datebox{text-align:right;border-left:1px solid var(--line);padding-left:13px}.datebox strong{display:block;font-size:27px;line-height:1.1;color:#72d8ff;letter-spacing:-1px}.datebox span{font-size:12px;color:var(--muted);text-transform:uppercase}.entryactions{display:flex;gap:7px;margin-top:10px}.mini{padding:6px 9px;border-radius:8px;background:#172638;border:1px solid #2a4058;color:#b9ddf2;font-size:12px}
.project{padding:15px;display:grid;grid-template-columns:118px minmax(0,1fr) 125px;gap:16px;align-items:center}.project .photo{height:104px}.projectdata{display:flex;gap:8px 16px;flex-wrap:wrap;color:#a9b9cb;font-size:12px;margin-top:9px}.tag{display:inline-flex;align-items:center;border-radius:30px;padding:3px 9px;font-size:11px;font-weight:700;background:#153c35;color:#6ce2b4}.tag.closed{background:#322b38;color:#c4a9e7}.tag.blue{background:#14324b;color:#77d6ff}
.projectside{text-align:right}.projectside strong{font-size:24px;color:var(--cyan);display:block}.projectside small{color:var(--muted)}
.empty{padding:35px 20px;text-align:center;border:1px dashed #2b3b50;border-radius:15px;color:var(--muted)}.empty b{color:#dceeff;display:block;margin-bottom:5px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{max-width:220px}
input,select,textarea{width:100%;background:#0a111b;color:var(--text);border:1px solid #2a3b50;border-radius:10px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#1c9bd2;box-shadow:0 0 0 3px #149bd21c}textarea{resize:vertical;min-height:82px}
label{display:block;color:#b7c7d8;font-size:12px;font-weight:650;margin-bottom:6px}.field{margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalback{position:fixed;inset:0;background:#02050bd9;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalback.show{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#101925;border:1px solid #2a4057;border-radius:18px;padding:22px;box-shadow:0 25px 80px #000b}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:19px}.x{border:0;background:#1a293a;color:#bcd0e4;border-radius:8px;padding:5px 10px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.filehint{font-size:11px;color:var(--muted);margin-top:5px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.detailstat{background:#0b1420;border:1px solid var(--line);border-radius:12px;padding:12px}.detailstat small{color:var(--muted);display:block}.detailstat b{font-size:20px}.subjectrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;color:#b9c9da}.subjectrow b{color:#75d8ff}
.file-selected{display:flex;align-items:center;gap:7px;color:#39d69b;font-size:12px;margin-top:6px;font-weight:700}
.file-selected .check{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#123d32;color:#6ff0bd}
.cropbox{position:relative;width:100%;aspect-ratio:16/9;background:#050a12;border:1px solid #34506a;border-radius:12px;overflow:hidden;margin:12px 0}
.cropbox img{width:100%;height:100%;object-fit:cover;transform-origin:center;transition:transform .08s}
.cropcontrols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cropcontrols label{font-size:12px;color:var(--muted)}
.cropcontrols input{width:100%}
.classification{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:linear-gradient(100deg,#173e68,#164e58);border:1px solid #28b9e8;color:#9ceaff;font-weight:800;box-shadow:0 0 18px #16b8f533}
.pdfrow .pdfactions{display:flex;gap:7px;align-items:center}
.btn.danger,.mini.danger{border-color:#713443;color:#ff9ba7;background:#351923}

.pdfrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#0b1420;border:1px solid var(--line);border-radius:10px;margin-top:8px}
footer{text-align:center;color:#65768b;font-size:11px;margin-top:35px}
@media(max-width:700px){.app{padding:15px 13px 45px}header{margin-bottom:20px}.today{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat strong{font-size:23px}nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}nav button{padding:9px 5px;font-size:12px}.entry{grid-template-columns:88px minmax(0,1fr);gap:12px;padding:11px}.entry .photo{height:92px}.datebox{grid-column:2;grid-row:1;text-align:left;border:0;padding:0;display:flex;align-items:baseline;gap:7px}.datebox strong{font-size:20px}.datebox span{font-size:10px}.entrymain{grid-column:2}.entrymain h4{font-size:14px}.entry .desc{font-size:12px}.entryactions{margin-top:8px}.project{grid-template-columns:82px minmax(0,1fr);gap:11px;padding:11px}.project .photo{height:85px}.projectside{grid-column:2;text-align:left;display:flex;align-items:center;gap:8px}.projectside strong{font-size:17px}.projectdata{gap:5px 9px}.grid2{grid-template-columns:1fr}.detailgrid{grid-template-columns:repeat(2,1fr)}h2{font-size:21px}}
 .cropmodal{width:min(650px,100%);padding:15px}.cropmodal .modalhead{gap:8px}.cropmodal .modalhead h3{font-size:16px}.cropstage{display:block;width:100%;height:min(54vh,410px);background:#05070b;touch-action:none;cursor:grab;border-radius:12px}.cropstage:active{cursor:grabbing}.cropbar{display:flex;align-items:center;gap:7px;margin-top:13px}.cropbar input{min-width:40px;flex:1;padding:0;accent-color:#38bdf8}.cropbar button{white-space:nowrap}.brand img{border-radius:50%}.entry .photo{aspect-ratio:4/3;height:auto}.project .photo{aspect-ratio:16/9;height:auto}#modalbody>.photo{aspect-ratio:16/9;height:auto;max-height:280px;object-fit:contain}
</style>
<style>
#authScreen{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#10283d 0%,#080d15 55%);color:#e8eff8}
#authScreen[hidden],.app[hidden]{display:none!important}
.auth-card{width:min(100%,420px);padding:32px;box-sizing:border-box;background:#101925;border:1px solid #26394d;border-radius:24px;box-shadow:0 24px 90px #0007}
.auth-brand{text-align:center;margin-bottom:28px}.auth-brand img{width:100px;height:100px;object-fit:cover;border-radius:22px}.auth-brand h1{font-size:25px;letter-spacing:1px;margin:16px 0 6px;color:#38bdf8}.auth-brand p,.auth-note{color:#91a5b9;font-size:13px;line-height:1.5}
#authForm{display:grid;gap:12px}#authForm label{font-size:13px;font-weight:600}#authForm input{width:100%;box-sizing:border-box;padding:14px;background:#0a111c;color:#e8eff8;border:1px solid #30445a;border-radius:10px;font-size:16px}
#authScreen button{width:100%;padding:13px;border-radius:10px;font-weight:600;cursor:pointer}.auth-primary{background:#087bb9;color:white;border:0}.auth-secondary{background:transparent;color:#dce9f4;border:1px solid #30445a}.auth-link{background:none;border:0;color:#55cfff;text-align:right;padding:4px!important}.auth-note{text-align:center;margin:15px 0 0}.auth-preview{margin-top:16px;border:1px dashed #37546d;background:#142132;color:#b9d9ef}.auth-switch{margin-top:8px}
#authScreen [hidden]{display:none!important}.pass-wrap{position:relative}.pass-wrap input{padding-right:55px!important}#authScreen #togglePass{position:absolute;right:4px;top:3px;width:44px;height:44px;padding:8px;background:transparent;border:0;color:#8edaff}#authStatus[data-kind="error"]{color:#ff9292;background:#381d28;padding:12px;border-radius:8px}#authStatus[data-kind="success"]{color:#86efac;background:#123326;padding:12px;border-radius:8px}#authSubmit:disabled{opacity:.65;cursor:wait}
</style><style id="gatao-neon-style">
#gatao-neon{position:fixed;inset:0;background:#000;z-index:2147483647;display:grid;place-items:center;animation:neonExit .65s ease 2.35s both;pointer-events:auto}
#gatao-neon img{display:block;width:min(84vw,70dvh,560px);height:auto;aspect-ratio:1;object-fit:contain;mask-image:radial-gradient(ellipse,#000 58%,transparent 76%)}
@keyframes neonExit{to{opacity:0;visibility:hidden;pointer-events:none}}
@media(prefers-reduced-motion:reduce){#gatao-neon{display:none}}
</style></head>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DBKEY='gatao_estudos_v1', LOGOKEY='gatao_estudos_logo_v1'; let db={logs:[],projects:[]}, activeTab='diario', deferredPrompt=null;
function load(){try{return JSON.parse(localStorage.getItem(DBKEY))||{logs:[],projects:[]}}catch(e){return{logs:[],projects:[]}}}
function save(){cloudSave()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{if(!d)return'—';let x=new Date(d+'T12:00:00');return x.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')};

const hours=m=>{let h=Math.floor(m/60),r=m%60;return h?`${h}h${r?` ${r}min`:''}`:`${r}min`};
const project=id=>db.projects.find(p=>p.id===id);
function totalLogs(list){return list.reduce((s,l)=>s+mins(l),0)}
function openModal(title,html,after){$('#modaltitle').textContent=title;$('#modalbody').innerHTML=html;$('#modalback').classList.add('show');$('#closeModal').onclick=closeModal;$('#cancel').onclick=closeModal;after&&after()}
function closeModal(){$('#modalback').classList.remove('show')}
function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function selectedFile(inputId,label){
 const el=$('#'+inputId); if(!el)return;
 el.addEventListener('change',()=>{
  let old=$('#'+inputId+'-selected'); if(old)old.remove();

function initLogo(){
 const saved=null; if(saved)$('#appLogo').src=saved;
 $('#changeLogoBtn').onclick=()=>$('#logoFile').click();
 $('#logoFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file)return;

  catch(err){alert('Não foi possível carregar essa imagem.');}
  e.target.value='';
 });
}

function renderMetrics(){let logs=db.logs,minsAll=totalLogs(logs),days=new Set(logs.map(l=>l.date)).size,by={};logs.forEach(l=>by[l.subject]=(by[l.subject]||0)+mins(l));let best=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,7);let last7=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);last7.push({label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),m:totalLogs(logs.filter(l=>l.date===key))})}let max=Math.max(1,...last7.map(x=>x.m));$('#view').innerHTML=`<h2>Minha evolução</h2><p class="sub">Métricas calculadas automaticamente a partir das suas postagens diárias.</p><div class="stats"><div class="stat"><small>Horas acumuladas</small><strong>${hours(minsAll)}</strong><span>tempo total de estudo</span></div><div class="stat"><small>Dias estudados</small><strong>${days}</strong><span>dias com pelo menos um registro</span></div><div class="stat"><small>Média por dia estudado</small><strong>${days?hours(Math.round(minsAll/days)):'0min'}</strong><span>considerando dias ativos</span></div><div class="stat"><small>Projetos concluídos</small><strong>${db.projects.filter(p=>p.status==='encerrado').length}</strong><span>objetivos encerrados</span></div></div><div class="panel" style="padding:18px;margin-bottom:15px"><h3 style="margin:0 0 18px">Tempo de estudo — últimos 7 dias</h3><div style="height:170px;display:flex;align-items:end;gap:12px">${last7.map(x=>`<div style="flex:1;text-align:center"><div style="height:125px;display:flex;align-items:end;background:#0a121d;border-radius:8px;overflow:hidden"><div title="${hours(x.m)}" style="width:100%;height:${Math.max(x.m?4:0,x.m/max*100)}%;background:linear-gradient(0deg,#087db9,#50d4ff);border-radius:7px 7px 0 0"></div></div><small style="color:#9aacc0;display:block;margin-top:7px">${x.label}</small></div>`).join('')}</div></div><div class="panel" style="padding:18px"><h3 style="margin:0 0 12px">Tempo por matéria</h3>${best.length?best.map(([s,m])=>`<div class="subjectrow"><span>${esc(s)}</span><b>${hours(m)}</b></div>`).join(''):'<div class="empty">Adicione registros para visualizar suas métricas.</div>'}</div><div class="sectionhead"><h3>Backup dos dados</h3><button class="btn secondary" id="backup">Exportar backup JSON</button></div><p class="sub">Guarde uma cópia dos registros e projetos. O backup inclui fotos e PDFs anexados.</p><input type="file" id="restore" accept="application/json" style="max-width:360px"><button class="btn ghost" id="restoreBtn" style="margin-left:7px">Restaurar backup</button>`;

function authError(e){const code=e?.code||'', msg=String(e?.message||'');if(code==='invalid_credentials'||/invalid login credentials/i.test(msg))return 'E-mail ou senha inválidos. Confira e tente novamente.';if(code==='email_not_confirmed'||/email not confirmed/i.test(msg))return 'Confirme seu e-mail antes de entrar.';if(code==='over_email_send_rate_limit'||e?.status===429||/rate limit/i.test(msg))return 'Muitas tentativas. Aguarde alguns minutos.';if(code==='email_address_not_authorized')return 'Este e-mail ainda não está autorizado pelo serviço de envio.';if(code==='weak_password')return 'Senha muito fraca. Escolha uma senha mais segura.';if(/failed to fetch|network|load failed/i.test(msg))return 'Erro de conexão com o Supabase. Confira a internet e a configuração do projeto.';if(/invalid api key|unauthorized api key/i.test(msg))return 'Chave de conexão inválida. Confira a chave publicável no Supabase.';return 'Não foi possível concluir: '+(msg||'erro desconhecido');}
const bucket=()=>client.storage.from('app_do_gatao');
async function encode(v,paths,owner){if(typeof v==='string' && /^data:(image\/|application\/pdf)/.test(v)){let path=known.get(v);if(!path){const blob=await (await fetch(v)).blob();path=owner+'/'+crypto.randomUUID();const {error}=await bucket().upload(path,blob,{contentType:blob.type});if(error)throw error;known.set(v,path);}paths.add(path);return {__storage:path};}if(Array.isArray(v))return Promise.all(v.map(x=>encode(x,paths,owner)));if(v&&typeof v==='object'){const out={};for(const [k,x] of Object.entries(v))out[k]=await encode(x,paths,owner);return out;}return v;}
async function decode(v){if(v?.__storage){const path=v.__storage;const {data,error}=await bucket().download(path);if(error)throw error;const str=await fileData(data);known.set(str,path);remotePaths.add(path);return str;}if(Array.isArray(v))return Promise.all(v.map(decode));if(v&&typeof v==='object'){const out={};for(const [k,x] of Object.entries(v))out[k]=await decode(x);return out;}return v;}
function cloudSave(){if(!user)return;const owner=user.id,snapshot=JSON.parse(JSON.stringify(db));status.textContent='Salvando na nuvem…';queue=queue.catch(()=>{}).then(async()=>{const paths=new Set();const workspace=await encode(snapshot,paths,owner);const {error}=await client.from('user_workspaces').upsert({user_id:owner,workspace,updated_at:new Date().toISOString()});if(error)throw error;const removed=[...remotePaths].filter(x=>!paths.has(x));remotePaths=paths;if(removed.length){const {error}=await bucket().remove(removed);if(error)throw error;for(const [k,v] of known)if(removed.includes(v))known.delete(k);}failed=false;status.textContent='✓ Salvo na nuvem';}).catch(e=>{failed=true;status.textContent='Erro ao salvar: '+e.message+' — use Tentar salvar novamente.';});}
async function enter(session){if(!session||user?.id===session.user.id)return;const owner=session.user;known.clear();remotePaths.clear();q('authStatus').textContent='Carregando seus registros…';const {data,error}=await client.from('user_workspaces').select('workspace').eq('user_id',owner.id).maybeSingle();if(error)throw error;db=data?await decode(data.workspace):{logs:[],projects:[],settings:{}};user=owner;$('#appLogo').src=db.settings?.logo||originalLogo;setTab('diario');q('authScreen').hidden=true;app.hidden=false;status.textContent='✓ Conectado à nuvem';}

q('authForm').onsubmit=async e=>{e.preventDefault();if(!client){notice('Não foi possível carregar a conexão com o Supabase. Atualize a página e confira a internet.','error');return;}const email=q('authEmail').value.trim(),password=q('authPass').value,redirect=location.origin+location.pathname.replace(/index\.html$/,'');if(mode!=='newpass'&&(!email||!q('authEmail').validity.valid)){notice('Informe um e-mail válido.','error');return;}if(mode!=='reset'&&!password){notice('Digite sua senha.','error');return;}if(['signup','newpass'].includes(mode)&&password.length<6){notice('A senha deve ter pelo menos 6 caracteres.','error');return;}const controls=['authSubmit','authSwitch','authForgot','authEmail','authPass','togglePass'];const label=q('authSubmit').textContent;controls.forEach(id=>q(id).disabled=true);q('authSubmit').textContent=mode==='reset'?'Enviando…':'Aguarde…';notice('Processando sua solicitação…');try{let result;if(mode==='signup')result=await client.auth.signUp({email,password,options:{emailRedirectTo:redirect}});else if(mode==='reset')result=await client.auth.resetPasswordForEmail(email,{redirectTo:redirect});else if(mode==='newpass')result=await client.auth.updateUser({password});else result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;q('authPass').value='';showPass(false);if(mode==='reset'){notice('Solicitação enviada! Se o e-mail estiver cadastrado, confira sua caixa de entrada e spam.','success');}else if(mode==='newpass'){setMode('login');await client.auth.signOut();notice('Senha alterada com sucesso! Entre com sua nova senha.','success');}else if(result.data.session){notice('Login realizado! Carregando seus registros…','success');await enter(result.data.session);}else notice('Cadastro solicitado! Confira seu e-mail para confirmar a conta.','success');}catch(e){notice(authError(e),'error');}finally{controls.forEach(id=>q(id).disabled=false);if(['Aguarde…','Enviando…'].includes(q('authSubmit').textContent))q('authSubmit').textContent=label;}};
